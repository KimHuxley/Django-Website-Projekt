{% load static %}
{% include 'navbar.html' %}

<p>Na tej stronie znajdują się filmy z poprawnym wykonywaniem ćwiczeń oraz wskazówkami.</p>

<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Filmy Instruktażowe</title>
</head>
<body>
    <h1>Ćwiczenia</h1>
    <div>
        {% for exercise in exercises %}
        <div>
            <h2>{{ exercise.title }}</h2>
            <p>{{ exercise.description }}</p>
            <video controls width="400">
                <source src="{{ exercise.video.url }}" type="video/mp4">
                Twoja przeglądarka nie wspiera odtwarzania wideo.
            </video>
            <!-- Formularz dodawania ćwiczenia do planu -->
            <form method="post" action="{% url 'dodaj_do_planu' exercise.id %}">
                {% csrf_token %}
                <label for="plan">Wybierz plan:</label>
                <select name="plan_id" required>
                    {% for plan in request.user.training_plans.all %}
                        <option value="{{ plan.id }}">{{ plan.title }}</option>
                    {% endfor %}
                </select>
                <button type="submit">Dodaj do planu</button>
            </form>
            
            
        </div>
        {% endfor %}
    </div>
</body>
</html>
